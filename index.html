<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Products</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.0/css/all.min.css"
    />
    <link rel="stylesheet" href="style.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <header>
      <a href="logo" class="logo">StudentScore</a>
      <nav class="nav">
        <ul>
          <a href="#" class="active"> <li>Shop</li></a>
          <a href="#"> <li>Categories</li></a>
          <a href="#"> <li>Deals</li></a>
          <a href="#"> <li>My Orders</li></a>
        </ul>
      </nav>
      <input type="text" class="input" placeholder="Search..." />
      <i class="fa-solid fa-magnifying-glass"></i>
      <i class="fa-solid fa-cart-shopping"></i>
      <i class="fa-regular fa-circle-user"></i>
    </header>

    <main>
      <section class="section1">
        <h1>All Products</h1>
        <div class="all">
          <div class="text">
            <p>Find exactly what you need this semester</p>
          </div>
          <div class="buttons">
            <button class="filter">Filter</button>
            <i class="fa-solid fa-filter"></i>
            <button class="sort">Sort</button>
            <i class="fa-solid fa-arrow-down-wide-short"></i>
          </div>
        </div>
      </section>

      <section class="section2"></section>
    </main>

    <footer>
      <a href="logo" class="logos">StudentScore</a>
      <div>
        <nav class="navigation">
          <ul>
            <p class="p3">© 2024 StudentStore. Practice Fetch API Project.</p>
            <a href=""> <li>API Docs</li> </a>
            <a href=""> <li>Support</li> </a>
            <a href=""> <li>Privacy Policy</li> </a>
            <a href=""> <li>Terms</li> </a>
          </ul>
        </nav>
      </div>
    </footer>
    <script src="script.js"></script>
  </body>
</html>
